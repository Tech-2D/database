- id: catalogos-e-chaves
  title: Cache dos catálogos
  nav: Cache dos catálogos
  icon: cache
  description: Acelera a abertura do calendário e a busca de professores. A API entrega cópias temporárias das consultas a contas autenticadas. As atividades e os horários ficam no PostgreSQL.
  source: redis-catalog.js
  entries:
    - id: cache-agenda
      name: Calendário da Agenda
      key: 'tech2d:{cache}:agenda:<revisao>:<hash_filtros>'
      type: String (JSON ou JSON compactado)
      ttl: 60 s
      ttl_seconds: 60
      description: Guarda as atividades da turma, as atividades gerais e a lista de turmas ativas.
      expiry: O prazo começa quando a API gera uma nova cópia para a turma consultada.
      route: GET /api/catalog/agenda
    - id: cache-updates
      name: Turmas no catálogo de atualizações
      key: 'tech2d:{cache}:atualizacoes:<revisao>:<hash_filtros>'
      type: String (JSON ou JSON compactado)
      ttl: 60 s
      ttl_seconds: 60
      description: Guarda a lista de turmas ativas usada pela rota de atualizações. A rota busca as publicações diretamente nas chaves do grupo atualizacoes.
      expiry: O prazo começa quando a API grava a resposta gerada pelo PostgreSQL.
      route: GET /api/catalog/updates
    - id: cache-schedules
      name: Horários do Cadê o professor
      key: 'tech2d:{cache}:horarios:<revisao>:<hash_filtros>'
      type: String (JSON ou JSON compactado)
      ttl: 5 min
      ttl_seconds: 300
      description: Guarda os horários ativos selecionados pelos filtros de turma, dia e busca.
      expiry: O prazo começa quando a API gera a resposta para aquela combinação de filtros.
      route: GET /api/catalog/schedules

- id: periodo-de-recuperacao
  title: Período de recuperação
  nav: Recuperação
  icon: calendar
  description: Indica qual edição do edital aparece na Agenda e em quais datas. O edital e os horários são mantidos no PostgreSQL.
  source: recovery.js
  entries:
    - id: recuperacao-publicacao
      name: Edição publicada
      key: 'tech2d:{recuperacao}:publicacao'
      type: String (JSON)
      ttl: Até o fim do período
      ttl_seconds: configuravel
      description: Guarda o identificador da edição e as datas de início e fim. A API mostra o edital apenas dentro desse intervalo.
      expiry: Na ativação imediata o painel aceita de 1 a 90 dias. Para uma edição com datas definidas, vale a data final da publicação. Um superadministrador pode desativar o período antes da expiração.
      route: GET /api/recovery e GET/POST /api/admin/recovery

- id: comunicado-geral-da-agenda
  title: Comunicado geral da Agenda
  nav: Comunicado geral
  icon: home
  description: Usado em Administração → Aviso para todos. Mostra uma única mensagem geral para quem abre a Agenda, independentemente da turma. Uma nova publicação substitui a anterior.
  source: announcement.js
  entries:
    - id: announcement-latest
      name: Comunicado atual
      key: 'tech2d:{comunicado}:atual'
      type: String (JSON)
      ttl: 7 dias
      ttl_seconds: 604800
      description: Guarda a mensagem, a data e a versão do comunicado que aparece na Agenda.
      expiry: Cada publicação substitui o texto e inicia um novo prazo. O superadministrador também pode removê-lo.
      route: GET /api/catalog/agenda · GET /api/catalog/updates · POST /api/data
    - id: announcement-commit
      name: Recibo do comunicado
      key: 'tech2d:{comunicado}:recibo:<id_operacao>'
      type: String
      ttl: 7 dias
      ttl_seconds: 604800
      description: Guarda a assinatura da operação de publicar ou remover, para a API reconhecer uma tentativa repetida.
      expiry: O prazo conta da primeira gravação bem-sucedida da operação.
      route: POST /api/data

- id: atualizações-da-agenda
  title: Atualizações da Agenda
  nav: Atualizações
  icon: layers
  description: Usado no menu Atualizações e no pop-up de novidades ao abrir a Agenda. Cada publicação fica disponível por 14 dias; depois sai tanto da lista quanto do pop-up.
  source: agenda-updates.js
  entries:
    - id: update-item
      name: Publicação individual
      key: 'tech2d:{atualizacoes}:item:<id_atualizacao>'
      type: String (JSON)
      ttl: 14 dias
      ttl_seconds: 1209600
      description: Guarda título, descrição, data e os dados do crédito da sugestão quando autorizado. A API seleciona os campos públicos antes de devolvê-los.
      expiry: O prazo conta da publicação de cada item e continua correndo quando sai outra atualização.
      route: GET /api/catalog/updates · GET /api/catalog/agenda · POST /api/data
    - id: update-index
      name: Índice de atualizações
      key: 'tech2d:{atualizacoes}:indice'
      type: ZSET
      ttl: 14 dias
      ttl_seconds: 1209600
      description: Associa o ID de cada atualização à expiração em milissegundos desde a época Unix. A API lista até 100 publicações vigentes.
      expiry: Uma publicação nova renova o prazo do índice. O prazo de cada publicação segue na chave do item.
      route: GET /api/catalog/updates · GET /api/catalog/agenda · POST /api/data
    - id: update-commit
      name: Recibo de publicação
      key: 'tech2d:{atualizacoes}:recibo:<id_operacao>'
      type: String
      ttl: 14 dias
      ttl_seconds: 1209600
      description: Guarda a assinatura da publicação para evitar duplicidade se a mesma requisição for reenviada.
      expiry: O prazo conta da primeira gravação bem-sucedida.
      route: POST /api/data

- id: quadro-de-avisos-das-turmas
  title: Quadro de avisos das turmas
  nav: Avisos das turmas
  icon: table
  description: Alimenta o quadro de cada turma. Representantes gerenciam os avisos da própria turma e superadministradores podem gerenciar os de qualquer turma.
  source: board-notices.js
  entries:
    - id: notice-item
      name: Aviso individual
      key: 'tech2d:{avisos}:item:<id_aviso>'
      type: String (JSON)
      ttl: 7 dias
      ttl_seconds: 604800
      description: Guarda o texto, a turma, a autoria, a versão e a data de expiração. O e-mail e o UID do autor ficam fora da resposta para alunos.
      expiry: O prazo conta da publicação. Edições preservam a expiração original e a exclusão remove o item imediatamente.
      route: GET /api/catalog/notices?class=… · POST /api/data
    - id: notice-index
      name: Índice por turma
      key: 'tech2d:{avisos}:turma:<turma>'
      type: ZSET
      ttl: 7 dias
      ttl_seconds: 604800
      description: Associa os IDs dos avisos da turma à expiração em milissegundos desde a época Unix. A API usa a data para recuperar só os avisos vigentes.
      expiry: Uma publicação nova na turma renova o prazo do índice. Os avisos conservam a validade individual.
      route: GET /api/catalog/notices?class=… · POST /api/data
    - id: notice-commit
      name: Recibo de gravação
      key: 'tech2d:{avisos}:recibo:<id_operacao>'
      type: String
      ttl: 7 dias
      ttl_seconds: 604800
      description: Guarda a assinatura da criação, edição ou exclusão. A API usa o recibo para reconhecer o reenvio da mesma operação.
      expiry: Cada operação bem-sucedida tem o seu próprio prazo.
      route: POST /api/data

- id: bloqueios-da-agenda
  title: Bloqueios temporários da Agenda
  nav: Bloqueios da Agenda
  icon: key
  description: O painel Usuários e bloqueios identifica a conta pelo e-mail ou UID. O Worker confirma o cadastro e guarda o bloqueio pelo UID. Superadministradores podem configurar a duração ou liberar a conta antes do prazo.
  source: agenda-blocks.js
  entries:
    - id: block-user
      name: Bloqueio por conta
      key: 'tech2d:{bloqueios}:usuario:<uid_codificado>'
      type: String (JSON)
      ttl: Configurável
      ttl_seconds: configuravel
      description: Guarda UID, e-mail no momento do bloqueio, administrador, data de criação e data de liberação. O UID passa por encodeURIComponent para formar a chave.
      expiry: O administrador escolhe entre 1 minuto e 365 dias. O Redis remove a chave na data de liberação. A mesma conta continua bloqueada se trocar o e-mail.
      route: GET /api/admin/agenda-users · POST /api/admin/agenda-users · rotas protegidas da Agenda
    - id: block-index
      name: Índice de bloqueios vigentes
      key: 'tech2d:{bloqueios}:indice'
      type: ZSET
      ttl: Até a última liberação
      ttl_seconds: dinamico
      description: Relaciona os UIDs bloqueados às datas de expiração em milissegundos. O painel consulta apenas entradas vigentes e usa o índice para paginar os resultados.
      expiry: A chave expira na data de liberação mais distante. Um bloqueio curto mantém o prazo necessário para listar bloqueios mais longos.
      route: GET /api/admin/agenda-users
    - id: block-commit
      name: Recibo de bloqueio ou liberação
      key: 'tech2d:{bloqueios}:recibo:<id_operacao>'
      type: String
      ttl: 24 h
      ttl_seconds: 86400
      description: Reconhece uma repetição da mesma operação e evita que um reenvio renove o prazo do bloqueio.
      expiry: O prazo começa na primeira gravação bem-sucedida.
      route: POST /api/admin/agenda-users

- id: convites-de-representantes
  title: Convites de representantes
  nav: Convites de representantes
  icon: key
  description: A aprovação libera o e-mail para ativar a conta como representante da turma em até sete dias. A ativação grava o papel no PostgreSQL, que continua válido depois que o convite expira.
  source: representative-invites.js
  entries:
    - id: invite-item
      name: Convite por operação de aprovação
      key: 'tech2d:{convites}:item:<id_operacao>'
      type: String (JSON)
      ttl: 7 dias
      ttl_seconds: 604800
      description: Guarda e-mail, turma, pedido de origem, data de aprovação e expiração. Também vincula a aprovação ao recibo da gravação.
      expiry: Sete dias a partir da aprovação. Repetir uma operação já confirmada mantém o prazo original. A API só aceita convites cujo recibo SQL esteja confirmado.
      route: POST /api/data · ativação do representante
    - id: invite-index
      name: Índice de convites vigentes
      key: 'tech2d:{convites}:indice'
      type: ZSET
      ttl: Até a última expiração
      ttl_seconds: dinamico
      description: Organiza as operações pela expiração e permite listar os convites vigentes no painel de representantes.
      expiry: A chave expira na data do último convite registrado. Cada item tem o próprio prazo de sete dias.
      route: POST /api/data · lista administrativa
    - id: invite-email
      name: Índice por e-mail aprovado
      key: 'tech2d:{convites}:email:<hash_email>'
      type: ZSET
      ttl: Até a última expiração do e-mail
      ttl_seconds: dinamico
      description: Localiza os convites do e-mail autenticado. O sufixo usa SHA-256 do e-mail normalizado serializado em JSON, para formar a chave.
      expiry: A chave expira na data de vencimento mais distante entre os convites desse e-mail. Convites vencidos deixam de autorizar a ativação.
      route: POST /api/data · consulta e ativação da própria conta

- id: reservas-resumo-semanal
  title: Envios do resumo semanal
  nav: Envios do resumo semanal
  icon: cache
  description: Usado pelo envio automático do resumo semanal por e-mail. Reserva o envio por conta e semana para impedir que duas execuções mandem o mesmo resumo. Não armazena o texto do e-mail nem as atividades da turma.
  source: digest-deliveries.js
  entries:
    - id: digest-delivery
      name: Reserva de envio por conta e semana
      key: 'tech2d:{resumos}:item:<hash_semana_e_conta>'
      type: String (JSON)
      ttl: Até 28 dias após o início da semana
      ttl_seconds: dinamico
      description: O sufixo deriva do caminho do registro, que identifica a conta e a segunda-feira do resumo. A chave guarda a reserva e o resultado da tentativa, sem o e-mail do destinatário nem o conteúdo da mensagem.
      expiry: Expira 28 dias após a segunda-feira do resumo, à meia-noite UTC. Uma atualização de status preserva o prazo. Uma tentativa incerta permanece bloqueada contra reenvios automáticos até a expiração.
      route: POST /api/internal/web-data · somente o serviço de e-mail

- id: uploads-pendentes
  title: Envios pendentes de anexos
  nav: Envios pendentes de anexos
  icon: cache
  description: O Worker guarda a autorização temporária do upload no Redis. A API usa esses dados para validar o arquivo recebido. O anexo confirmado é registrado no PostgreSQL e o conteúdo fica no Cloudflare R2.
  source: pending-uploads.js
  entries:
    - id: pending-upload-records
      name: Registros de upload
      key: 'tech2d:{uploads}:registros'
      type: Hash (valores JSON)
      ttl: Sem TTL na chave
      description: Um campo por upload guarda o arquivo esperado, o UID, a atividade e a chave privada do objeto no R2.
      expiry: A confirmação é válida por uma hora. O registro permanece disponível depois desse prazo para que o serviço de limpeza possa apagar o objeto abandonado. Se o arquivo já consta como anexo, a limpeza só remove o registro no Redis.
      route: POST /api/internal/web-data · serviço de arquivos
    - id: pending-upload-index
      name: Índice por data de criação
      key: 'tech2d:{uploads}:por_data'
      type: ZSET
      ttl: Sem TTL na chave
      description: Ordena os uploads pendentes pela data de criação em milissegundos. O serviço de arquivos consulta os vencidos em lotes de até 100.
      expiry: A entrada sai do índice junto com o registro do upload.
      route: POST /api/internal/web-data · limpeza periódica

- id: limites-de-servico
  title: Limites de serviço
  nav: Limites de serviço
  icon: cache
  description: Protege a recuperação de senha, o envio de anexos e o envio de fotos contra excesso de tentativas. Conta os usos dentro de uma janela de uma hora; ao expirar, uma nova janela pode começar. Não é o histórico de acessos dos alunos.
  source: service-limits.js
  entries:
    - id: service-limit-counter
      name: Contador por serviço e escopo
      key: 'tech2d:{limites}:contador:<hash_do_escopo>'
      type: String (JSON)
      ttl: Até o fim da janela de uma hora
      ttl_seconds: 3600
      description: Guarda a quantidade de tentativas, a hora de expiração e a versão usada para detectar alterações simultâneas. O escopo depende do serviço, como conta ou limite global.
      expiry: O primeiro uso inicia uma janela de uma hora. As próximas tentativas preservam o vencimento original, e o Redis apaga a chave ao fim da janela.
      route: POST /api/internal/web-data · somente o backend
    - id: service-limit-receipt
      name: Recibo da atualização dos contadores
      key: 'tech2d:{limites}:recibo:<id_operacao>'
      type: String
      ttl: 1 hora após a gravação
      ttl_seconds: 3600
      description: Reconhece a repetição da mesma operação após uma falha de rede para evitar contar a mesma tentativa duas vezes.
      expiry: O recibo expira uma hora após a gravação.
      route: POST /api/internal/web-data · somente o backend

- id: pedidos-temporarios
  title: Sugestões e pedidos temporários
  nav: Sugestões e pedidos
  icon: clock
  description: Aparece em Sugerir atividade, Pedir agenda para minha turma, Sou representante e nos convites de Kanban compartilhado. Guarda cada pedido enquanto ele pode ser analisado, por até sete dias. A aprovação de um pedido não é uma permissão temporária — o acesso aprovado fica no PostgreSQL.
  source: temporary-requests.js
  entries:
    - id: pedidos-temporarios-valores
      name: Conteúdo e versões das solicitações
      key: 'tech2d:{pedidos}:item:<id_operacao>:<hash_caminho>'
      type: String (JSON)
      ttl: Até 7 dias
      ttl_seconds: 604800
      description: Guarda ID, caminho da API, dados, versão, expiração e referência ao recibo de confirmação SQL. Uma versão preparada só aparece após o recibo correspondente ser confirmado. O conteúdo inclui sugestões de atividades, pedidos de Agenda, pedidos do Kanban e solicitações de representação.
      expiry: Sugestões de atividades, pedidos de Agenda e solicitações de representação duram sete dias após o envio. Pedidos do Kanban duram sete dias após o envio ou a última mudança de estado. Registros migrados receberam o prazo a partir da migração.
      route: POST /api/data — get, query e commit para suggestions, agendaClassRequests, kanbanRequests e representativeRequests
    - id: pedidos-temporarios-colecoes
      name: Índice de solicitações por coleção
      key: 'tech2d:{pedidos}:colecao:<tipo>'
      type: ZSET
      ttl: Até 7 dias
      ttl_seconds: 604800
      description: Lista versões de sugestões de atividades, pedidos de novas turmas ou pedidos de representação. O trecho <tipo> é atividades, turmas ou representantes. A API seleciona a versão confirmada mais recente de cada registro e aplica os filtros e as permissões antes de devolver os resultados.
      expiry: Expira no prazo do item mais recente do índice. Entradas vencidas são removidas nas gravações e ignoradas nas leituras.
      route: POST /api/data — query
    - id: pedidos-temporarios-caminhos
      name: Índice por solicitação
      key: 'tech2d:{pedidos}:registro:<hash_caminho>'
      type: ZSET
      ttl: Até 7 dias
      ttl_seconds: 604800
      description: Localiza as versões de uma solicitação pelo hash de seu caminho. Uma gravação que falha no SQL não oculta a última versão confirmada; os dados preparados sem recibo válido são ignorados até expirarem.
      expiry: Expira no prazo da versão mais recente da solicitação.
      route: POST /api/data — get e commit

    - id: pedidos-kanban-escopo
      name: Índices de acesso ao Kanban
      key: 'tech2d:{pedidos}:kanban:<quadro_ou_usuario>:<hash_valor>'
      type: ZSET
      ttl: Até 7 dias
      ttl_seconds: 604800
      description: Localiza pedidos de acesso ao Kanban por quadro ou solicitante. O trecho <quadro_ou_usuario> é quadro ou usuario. O proprietário pode listar os pedidos do quadro e cada solicitante pode consultar os próprios. Participações aprovadas ficam no PostgreSQL.
      expiry: Expira no prazo da versão mais recente do índice. Pedidos vencidos são ignorados.
      route: POST /api/data — query de kanbanRequests

- id: limpeza-kanban
  title: Limpeza de anexos do Kanban
  nav: Limpeza do Kanban
  icon: clock
  description: Guarda os identificadores de cartões removidos para que a rotina diária localize e apague seus arquivos no R2. A API confirma a operação no PostgreSQL e verifica se o cartão ainda está ausente antes de excluir arquivos.
  source: kanban-cleanup-queue.js
  entries:
    - id: limpeza-kanban-pendentes
      name: Limpezas pendentes
      key: 'tech2d:{limpeza}:pendentes'
      type: List
      ttl: Sem TTL
      description: Recebe as limpezas de cartões removidos. Se o R2 falhar ou ainda houver arquivos a listar, o item volta ao fim da fila.
      expiry: Cada item é processado pela rotina diária. A lista desaparece quando fica vazia.
      route: POST /api/data e rotina diária de limpeza
    - id: limpeza-kanban-processamento
      name: Limpezas em processamento
      key: 'tech2d:{limpeza}:em_processamento'
      type: List
      ttl: Sem TTL
      description: Guarda os itens reservados antes de acessar o R2. A próxima execução recupera os itens deixados por uma rotina interrompida.
      expiry: Ao confirmar a limpeza, a rotina remove o item. Se a limpeza ainda estiver pendente, o item volta à fila.
      route: Rotina diária de limpeza
    - id: limpeza-kanban-trava
      name: Trava de processamento
      key: 'tech2d:{limpeza}:trava'
      type: String
      ttl: 2 min
      ttl_seconds: 120
      description: Coordena a execução da rotina e permite retomada após uma interrupção.
      expiry: Renovada durante o processamento e liberada ao encerrar.
      route: Rotina diária de limpeza
